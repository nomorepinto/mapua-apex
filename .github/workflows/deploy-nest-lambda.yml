# Deploys mapua-apex-backend-nest to an existing Lambda Web Function.
#
# Push to master (when this app or this workflow changes) runs lint and tests,
# compiles the Nest server with tsc, uploads that build and its production
# dependencies to the versioned S3 bucket the current revision already uses,
# and creates a new revision. workflow_dispatch does the same for whatever ref
# you run it from.
#
# This does not create the Web Function, its endpoint, CloudFront, or WAF.
# The endpoint must use auto-deployment mode LatestRevision so the new
# revision receives traffic when it becomes Active. The new revision copies
# the current revision's service configuration, including environment
# variables. The zip never includes .env.
#
# Repository configuration:
#   secrets.AWS_DEPLOY_ROLE_ARN   IAM role GitHub OIDC may assume
#   vars.AWS_REGION               region the function lives in
#   vars.LAMBDA_FUNCTION_NAME     Web Function name
#
# The role trust policy must allow sts:AssumeRoleWithWebIdentity from
# token.actions.githubusercontent.com, with:
#   aud = sts.amazonaws.com
#   sub = repo:nomorepinto@179000892/mapua-apex@1360915587:ref:refs/heads/master
# This repo was created after 15 July 2026, so the subject includes the
# owner id and the repository id. The name-only form is rejected.
# workflow_dispatch from any ref other than master uses that ref instead.
#
# AWSLambda_FullAccess covers the Lambda and iam:PassRole calls. It does not
# cover the S3 upload. The role also needs s3:PutObject, s3:GetObject, and
# s3:GetObjectVersion on the code bucket. The bucket policy must already
# allow lambda.amazonaws.com those GetObject actions, which the bucket Lambda
# created for this function does.
#
# The revision runs nodejs24.x. The server binds to AWS_LAMBDA_HTTP_ENDPOINT.
#
# package-lock.json is written by npm 11. Node 22's bundled npm 10 treats
# that lockfile as out of sync (Missing: typescript@5.9.3) and fails npm ci.
# Both jobs install npm 11.21.1 before npm ci.

name: Deploy Nest API

on:
  push:
    branches: [master]
    paths:
      - 'mapua-apex-backend-nest/**'
      - '.github/workflows/deploy-nest-lambda.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-nest-lambda
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mapua-apex-backend-nest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mapua-apex-backend-nest/package-lock.json

      - name: Use npm 11
        run: npm install -g npm@11.21.1

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: mapua-apex-backend-nest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mapua-apex-backend-nest/package-lock.json

      - name: Use npm 11
        run: npm install -g npm@11.21.1

      - name: Require deploy settings
        run: |
          if [ -z "$AWS_REGION" ] || [ -z "$LAMBDA_FUNCTION_NAME" ]; then
            echo "Set repository variables AWS_REGION and LAMBDA_FUNCTION_NAME, and secret AWS_DEPLOY_ROLE_ARN." >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run build:web
      - run: npm prune --omit=dev

      - name: Package the Web Function zip
        run: |
          printf '%s\n' "import './dist/main.js';" > index.js
          zip -qr web.zip index.js dist node_modules package.json
          rm -f index.js
          bytes=$(unzip -l web.zip | awk 'END {print $1}')
          echo "web.zip unpacks to ${bytes} bytes"
          if [ "$bytes" -gt 512000000 ]; then
            echo "Unpacked zip exceeds the 512 MB Web Function limit." >&2
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: mapua-apex-nest-${{ github.run_id }}

      - name: Ensure the AWS CLI supports Lambda Web Functions
        run: |
          if aws lambda-web help >/dev/null 2>&1; then
            exit 0
          fi
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update

      - name: Publish a Web Function revision
        run: |
          set -euo pipefail

          revision_id=$(aws lambda-web list-web-function-endpoints \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --query 'endpoints[0].revisionWeights[0].revisionId' \
            --output text)
          if [ -z "$revision_id" ] || [ "$revision_id" = "None" ]; then
            echo "No endpoint revision to copy service configuration from." >&2
            exit 1
          fi

          current=$(aws lambda-web get-web-function-revision \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --revision-id "$revision_id" \
            --output json)
          bucket=$(echo "$current" | jq -r '.buildConfig.codeConfig.s3Object.bucket')
          service_config=$(echo "$current" | jq -c '.serviceConfig | walk(if type == "object" then with_entries(select(.value != null)) else . end)')
          if [ -z "$bucket" ] || [ "$bucket" = "null" ]; then
            echo "The current revision has no S3 code bucket." >&2
            exit 1
          fi

          key="mapua-apex-backend/revisions/${GITHUB_SHA}-${GITHUB_RUN_ID}.zip"
          version_id=$(aws s3api put-object \
            --bucket "$bucket" \
            --key "$key" \
            --body web.zip \
            --query VersionId \
            --output text)
          if [ -z "$version_id" ] || [ "$version_id" = "None" ] || [ "$version_id" = "null" ]; then
            echo "Bucket $bucket did not return an object version. Enable versioning." >&2
            exit 1
          fi

          build_config=$(jq -nc \
            --arg bucket "$bucket" \
            --arg key "$key" \
            --arg versionId "$version_id" \
            '{codeConfig:{s3Object:{bucket:$bucket,key:$key,versionId:$versionId}},runtimeConfig:{runtime:"nodejs24.x"}}')

          new_id=$(aws lambda-web create-web-function-revision \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --build-config "$build_config" \
            --service-config "$service_config" \
            --query revisionId \
            --output text)
          echo "Created revision $new_id"

          for _ in $(seq 1 60); do
            state=$(aws lambda-web get-web-function-revision \
              --function-name "$LAMBDA_FUNCTION_NAME" \
              --revision-id "$new_id" \
              --query state \
              --output text)
            case "$state" in
              Active)
                echo "Revision $new_id is Active"
                exit 0
                ;;
              Failed)
                aws lambda-web get-web-function-revision \
                  --function-name "$LAMBDA_FUNCTION_NAME" \
                  --revision-id "$new_id" \
                  --query '{stateReason:stateReason,errors:errors}' \
                  --output json >&2
                exit 1
                ;;
            esac
            sleep 3
          done
          echo "Timed out waiting for revision $new_id" >&2
          exit 1
